<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img">
  <defs>
    <linearGradient id="heroGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="48%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CCFBF1"/>
    </linearGradient>
    <linearGradient id="blueGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="url(#heroGradient)"/>

    <g transform="translate(105 105) scale(1.171875)">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="18" y="26" width="74" height="68" rx="10" fill="#F8FAFC" stroke="#FFFFFF" stroke-width="12"/>
    <rect x="18" y="26" width="74" height="68" rx="10" fill="#F8FAFC" stroke="#172033" stroke-width="6"/>
    <path d="M21 44h68" stroke="#172033" stroke-width="6"/>
    <circle cx="34" cy="35" r="3.5" fill="#14B8A6" stroke="#172033" stroke-width="3"/>
    <circle cx="47" cy="35" r="3.5" fill="#F59E0B" stroke="#172033" stroke-width="3"/>
    <path d="M38 59h28" stroke="#94A3B8" stroke-width="6"/>
    <path d="M38 74h18" stroke="#CBD5E1" stroke-width="6"/>
    <path d="M61 80 101 40" stroke="#FFFFFF" stroke-width="18"/>
    <path d="M79 39h23v23" stroke="#FFFFFF" stroke-width="18"/>
    <path d="M61 80 101 40" stroke="#2563EB" stroke-width="10"/>
    <path d="M79 39h23v23" stroke="#2563EB" stroke-width="10"/>
  </g>
</g>
    <text x="300" y="155" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="48" font-weight="850" fill="#172033" text-anchor="start"><tspan x="300" dy="0">Local-only by design</tspan></text>
    <text x="302" y="208" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="25" font-weight="500" fill="#334155" text-anchor="start"><tspan x="302" dy="0">Open in Basic Window does not collect, transmit, sell,</tspan><tspan x="302" dy="31.25">track, or analyze user data.</tspan></text>

    <g filter="url(#cardShadow)">
      <rect x="135" y="330" width="295" height="205" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
      <circle cx="187" cy="386" r="22" fill="#2563EB"/>
      <path d="M177 386L185 394L201 375" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="167" y="440" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="27" font-weight="800" fill="#172033" text-anchor="start"><tspan x="167" dy="0">No analytics</tspan></text>
      <text x="167" y="475" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#334155" text-anchor="start"><tspan x="167" dy="0">No tracking scripts,</tspan><tspan x="167" dy="20">telemetry, or advertising</tspan><tspan x="167" dy="20">identifiers.</tspan></text>
    </g>


    <g filter="url(#cardShadow)">
      <rect x="475" y="330" width="295" height="205" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
      <circle cx="527" cy="386" r="22" fill="#14B8A6"/>
      <path d="M517 386L525 394L541 375" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="507" y="440" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="27" font-weight="800" fill="#172033" text-anchor="start"><tspan x="507" dy="0">No servers</tspan></text>
      <text x="507" y="475" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#334155" text-anchor="start"><tspan x="507" dy="0">Selected URLs are used</tspan><tspan x="507" dy="20">locally only to open the popup</tspan><tspan x="507" dy="20">window.</tspan></text>
    </g>


    <g filter="url(#cardShadow)">
      <rect x="815" y="330" width="295" height="205" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
      <circle cx="867" cy="386" r="22" fill="#F59E0B"/>
      <path d="M857 386L865 394L881 375" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="847" y="440" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="27" font-weight="800" fill="#172033" text-anchor="start"><tspan x="847" dy="0">No data sale</tspan></text>
      <text x="847" y="475" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#334155" text-anchor="start"><tspan x="847" dy="0">No data is collected, shared,</tspan><tspan x="847" dy="20">sold, or sent to third</tspan><tspan x="847" dy="20">parties.</tspan></text>
    </g>

    <rect x="250" y="610" width="780" height="70" rx="35" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/>
    <text x="640" y="640" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="21" font-weight="650" fill="#1E3A8A" text-anchor="middle"><tspan x="640" dy="0">Permissions are used only for context menus, target resolution,</tspan><tspan x="640" dy="26.25">popup windows, and Firefox-only bookmarks/containers.</tspan></text>

</svg>
