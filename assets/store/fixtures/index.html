<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open in Basic Window Screenshot Demo</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <p class="eyebrow">Screenshot fixture</p>
        <h1>Research Notes</h1>
        <p>
          A neutral page for capturing clean store screenshots and manually
          testing context-menu behavior.
        </p>
      </header>

      <section class="card primary">
        <div>
          <p class="eyebrow">Link target</p>
          <h2>Open a reference article</h2>
          <p>Right-click this large link and choose Open in Basic Window.</p>
        </div>
        <a class="big-link" href="https://example.com/reference">
          https://example.com/reference
        </a>
      </section>

      <section class="grid">
        <figure class="card">
          <img src="/demo-image.svg" alt="Abstract browser window graphic" />
          <figcaption>Right-click the image to test image targets.</figcaption>
        </figure>

        <section class="card">
          <p class="eyebrow">Frame target</p>
          <h2>Embedded frame</h2>
          <iframe title="Frame demo" src="/frame.html"></iframe>
        </section>
      </section>
    </main>
  </body>
</html>
