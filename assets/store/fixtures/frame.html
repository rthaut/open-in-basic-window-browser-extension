<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        font-family:
          Segoe UI,
          Inter,
          Arial,
          sans-serif;
        background: #eff6ff;
        color: #172033;
      }

      .frame {
        display: grid;
        min-height: 180px;
        place-items: center;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.4rem;
        font-size: 1.35rem;
      }

      p {
        margin: 0;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <section class="frame">
      <div>
        <h1>Frame content</h1>
        <p>Right-click here to test frame context.</p>
      </div>
    </section>
  </body>
</html>
