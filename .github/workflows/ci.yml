name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format source
        run: npm run format:source:check

      - name: Format docs
        run: npm run format:docs:check

      - name: Format scripts
        run: npm run format:scripts:check

      - name: Format actions
        run: npm run format:actions:check

      - name: Lint source
        run: npm run lint:source

      - name: Lint docs
        run: npm run lint:docs

      - name: Lint scripts
        run: npm run lint:scripts

      - name: Lint actions
        run: npm run lint:actions

      - name: Type-check
        run: npm run compile

      - name: Unit tests
        run: npm test

      - name: Build Chrome extension
        run: npm run build:chrome

      - name: Build Edge extension
        run: npm run build:edge

      - name: Build Firefox extension
        run: npm run build:firefox
